# ============================================
# Configuracion de Netlify para Flutter Web
# Literatura Sapiencial - App Educativa
# ============================================

[build]
  command = "echo 'Build pre-compilado desde Flutter'"
  publish = "frontend/build/web"

[build.environment]
  NODE_VERSION = "18"

# ============================================
# Redirects para SPA (Single Page Application)
# ============================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================
# Headers de Seguridad y Cache
# ============================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
